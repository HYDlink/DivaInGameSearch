# Search hotkey: Ctrl + this Win32 virtual-key code. Default 0x46 (F). Change it if another mod conflicts.
# 默认 Ctrl+F；使用 Win32 虚拟键值，如与其他 Mod 冲突请自行调整。
shortcut_vk=0x46
# Result row height in pixels.
# 统一行高，像素。
row_height=68
# Font size. On reload, the font atlas is rebuilt at a safe frame boundary.
# 重载时在安全帧边界重建中日字体图集。
font_size=19
# Panel opacity, 0.70 to 1.00.
# 面板透明度，0.70 到 1.00。
opacity=0.97
# Interface language: auto, zh-CN or en. Takes effect after restarting the game.
# 界面语言：auto、zh-CN 或 en。重启游戏后生效。
language=auto
# Close the panel after the game confirms the jump succeeded.
# 真实读回确认成功后关闭面板。
close_on_success=1
