# Search hotkey: Ctrl + this Win32 virtual-key code. Default 0x46 (F). Change it if another mod conflicts.
# 默认 Ctrl+F；使用 Win32 虚拟键值，如与其他 Mod 冲突请自行调整。
shortcut_vk=0x46
# Result row height in pixels.
# 统一行高，像素。
row_height=64
# Font size. On reload, the font atlas is rebuilt at a safe frame boundary.
# 重载时在安全帧边界重建中日字体图集。
font_size=19
# Panel opacity, 0.70 to 1.00.
# 面板透明度，0.70 到 1.00。
opacity=0.97
# Interface language. auto follows the game's language; or set en, ja or zh-CN. Takes effect after restarting the game.
# 界面语言。auto 跟随游戏语言；也可以指定 en、ja 或 zh-CN。重启游戏后生效。
language=auto
# Panel theme: pearl (bright, default) or classic (original dark). The theme button at the top right of the panel switches it and saves here.
# 界面主题：pearl 为珍珠白（默认），classic 为原深色；面板右上角的主题按钮会切换并保存到这里。
ui_theme=pearl
# Close the panel after the game confirms the jump succeeded.
# 真实读回确认成功后关闭面板。
close_on_success=1
# 独立 UI 色彩适配：auto 仅识别官方命名的 DIVA Luma 及匹配后缓冲；其余沿用原 SDR。
# 重命名或其他 HDR 插件可显式指定 hdr10 / scrgb；sdr 强制恢复原绘制路径。
ui_color_output=auto
# HDR 界面白亮度：auto 跟随 Luma 显示模式及白亮度配置；也可明确指定 80 到 400 尼特。
# Luma 的 SDR 模式按其标准使用 80 尼特；不影响普通 SDR 或游戏曝光。
ui_white_nits=auto
